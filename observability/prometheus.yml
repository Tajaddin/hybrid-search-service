global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: hss-api
    static_configs:
      - targets: ["api:8000"]
        labels: { service: hss-api, env: local }
  - job_name: hss-api-host
    static_configs:
      - targets: ["host.docker.internal:8120"]
        labels: { service: hss-api, env: host }
