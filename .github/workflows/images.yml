name: images

# Multi-arch images on GHCR for the cloud environment (k8s-platform-gitops pulls :latest; tags give a
# version). Each architecture builds natively (GitHub's arm64 runners are free for public repositories),
# then a manifest list joins them. GITHUB_TOKEN is enough to push packages linked to this repository.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "reports/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.image }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: api, context: ., file: Dockerfile, arch: amd64, runner: ubuntu-24.04 }
          - { image: api, context: ., file: Dockerfile, arch: arm64, runner: ubuntu-24.04-arm }
          - { image: ui, context: ui, file: ui/Dockerfile, arch: amd64, runner: ubuntu-24.04 }
          - { image: ui, context: ui, file: ui/Dockerfile, arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: free disk space (the API image carries CPU PyTorch)
        if: matrix.image == 'api'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - name: image name
        id: name
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          tags: ${{ steps.name.outputs.ref }}:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  manifest:
    name: ${{ matrix.image }} manifest
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [api, ui]
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: join the two architectures under :latest, :sha-<short> and the version tag
        run: |
          ref="ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}"
          tags=(-t "$ref:sha-${GITHUB_SHA::7}")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tags+=(-t "$ref:${GITHUB_REF_NAME#v}"); fi
          if [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/tags/v* ]]; then tags+=(-t "$ref:latest"); fi
          docker buildx imagetools create "${tags[@]}" "$ref:sha-$GITHUB_SHA-amd64" "$ref:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$ref:sha-${GITHUB_SHA::7}"
