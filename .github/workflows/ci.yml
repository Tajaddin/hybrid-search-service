name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.10.4"

jobs:
  python:
    name: lint, types, unit and API tests (fake engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - run: uv sync --extra dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not integration" --cov=hss --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v7
        with: { name: coverage, path: coverage.xml, retention-days: 7 }

  integration:
    name: OpenSearch and Redis with real models on a small catalog
    runs-on: ubuntu-latest
    services:
      opensearch:
        image: opensearchproject/opensearch:2.19.1
        env: { discovery.type: single-node, DISABLE_SECURITY_PLUGIN: "true", OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g" }
        ports: ["9201:9200"]
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9200/_cluster/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6381:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - uses: actions/cache@v6
        with: { path: data/models, key: models-minilm-v1 }
      - run: uv sync --extra dev
      - run: uv run pytest -m integration -q
        env: { HSS_OPENSEARCH_URL: http://localhost:9201, HSS_REDIS_URL: redis://localhost:6381/0, HSS_MODELS_DIR: data/models }

  ui:
    name: UI lint, build and Playwright end-to-end against the small catalog
    runs-on: ubuntu-latest
    services:
      opensearch:
        image: opensearchproject/opensearch:2.19.1
        env: { discovery.type: single-node, DISABLE_SECURITY_PLUGIN: "true", OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g" }
        ports: ["9201:9200"]
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9200/_cluster/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6381:6379"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, cache-dependency-path: ui/package-lock.json }
      - uses: astral-sh/setup-uv@v7
        with: { version: "${{ env.UV_VERSION }}", enable-cache: true }
      - uses: actions/cache@v6
        with: { path: data/models, key: models-minilm-v1 }
      - run: uv sync --extra dev
      - run: npm ci --no-audit --no-fund && npm run lint && npm run build
        working-directory: ui
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      - name: small catalog, index, reports and API
        run: |
          uv run python scripts/ci_fixture.py
          HSS_OPENSEARCH_URL=http://localhost:9201 HSS_REDIS_URL=redis://localhost:6381/0 HSS_PREPARED_DIR=data/ci/prepared HSS_REPORTS_DIR=data/ci/reports HSS_MODELS_DIR=data/models \
            uv run hss index
          HSS_OPENSEARCH_URL=http://localhost:9201 HSS_REDIS_URL=redis://localhost:6381/0 HSS_PREPARED_DIR=data/ci/prepared HSS_REPORTS_DIR=data/ci/reports HSS_MODELS_DIR=data/models HSS_ADMIN_KEY=ci \
            nohup uv run hss serve --port 8120 >api.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:8120/health && break; sleep 2; done
      - run: npx playwright test
        working-directory: ui
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: ui/playwright-report, retention-days: 7 }

  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$PWD/observability:/w" -w /w --entrypoint promtool prom/prometheus:v3.5.0 test rules alerts_test.yml

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with: { terraform_version: "1.9.8" }
      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
      - uses: astral-sh/setup-uv@v7
        with: { version: "${{ env.UV_VERSION }}" }
      - run: uv sync --extra dev
      - run: uv run pip-audit --skip-editable
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - run: npm audit --audit-level=high
        working-directory: ui

  images:
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: docker build -t hss/api:ci . && docker image ls hss/api:ci --format '{{.Repository}} {{.Size}}'
      - run: docker build -t hss/ui:ci ui && docker image ls hss/ui:ci --format '{{.Repository}} {{.Size}}'
